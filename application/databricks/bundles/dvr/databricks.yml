      email_mappings: '{"ARM":"MBD-Accountriskmanagement@bank-banque-canada.ca","ISLS":"SIslam@bank-banque-canada.ca"}'
      # lake-dev-oedataservices-services
      service_spn_id_key: "app-2b501945-5940-4527-9cdd-51a07b77ceb7-appid"
      service_spn_secrete_key: "app-2b501945-5940-4527-9cdd-51a07b77ceb7-secret"

      # DataBridge ingestion service settings
      dis_av_root: "https://lakecacnpdstdevavscan01.blob.core.windows.net/avscan-${var.project.tag}/${var.project.dataset}"
      dis_oedisext_client_id_key: "app-ec1ede6d-b2e2-4ec9-8db6-76dbf1410ec9-appid"
      dis_oedisext_client_secret_key: "app-ec1ede6d-b2e2-4ec9-8db6-76dbf1410ec9-secret"

      # DataBridge email service
      databridge_email_tenant_id_key: "app-3fc6e6c5-eaa5-4948-ba9a-d3ceebf437db-tenantid"
      databridge_email_client_id_key: "app-3fc6e6c5-eaa5-4948-ba9a-d3ceebf437db-appid"
      databridge_email_client_secret_key: "app-3fc6e6c5-eaa5-4948-ba9a-d3ceebf437db-secret"
      databridge_email_sender_account: "dda-support-dev@bocqa.bank-banque-canada.ca"

      # Deployment scripts: copy DataBench configuration, then repair app access.
      # Retain both names when adding other dev preparation scripts.
