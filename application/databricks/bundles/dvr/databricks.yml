      post_deploy_scripts: "start_app"
    resources:
      apps:
        swift-file-upload:
          # Bundle-managed app access replaces manual Authorization-tab entries,
          # so keep everyone who needs dev access listed here.
          permissions:
            - group_name: "lake_armrestricted_rusr_inda"  # ARM team
              level: CAN_USE
            - group_name: "lake_aeengsupport_rusr_inda"
              level: CAN_MANAGE
            # lake-bap01-devops-qa: DEV dbk-dab-deploy identity; keeps deploy access.
            - service_principal_name: "5569c96a-9bbf-423f-bed8-ff7e7dae61d3"
              level: CAN_MANAGE
            - user_name: "maxh@bocqa.bank-banque-canada.ca"  # Ally Ma
              level: CAN_MANAGE
            - user_name: "isls@bocqa.bank-banque-canada.ca"  # Sadia Islam
              level: CAN_MANAGE
            - user_name: "nevj@bocqa.bank-banque-canada.ca"  # Julian Neves Leite
              level: CAN_USE

  stg:
    mode: production
    variables:
      # Selected job cluster policy ID; regular is the default.
      compute_classic_job_policy_id: "00019C9CFEBF0831"

      # lake-stg-oedataservices-services
      job_runas_account: "118bb443-4441-422d-b9b4-14cdc5ede028"
      # lake-stg-oedataservices-app (shared app account)
      app_spn_application_id: "102a1f42-b0bd-4af8-8625-69f256fac742"
      job_alert_emails:
        - dda-support-stg@bank-banque-canada.ca
        - DataLakeMonitoring-STG@bank-banque-canada.ca
      job_permissions:
        - group_name: "lake_aeengsupport_rusr_inpa"
          level: CAN_MANAGE
        # lake-stg-oedataservices-services
        - service_principal_name: "118bb443-4441-422d-b9b4-14cdc5ede028"
          level: CAN_MANAGE_RUN
        # lake-stg-oedataservices-app: the upload app starts and monitors runs
        - service_principal_name: "102a1f42-b0bd-4af8-8625-69f256fac742"
          level: CAN_MANAGE_RUN
        - group_name: "lake_dmengineer_rusr_inpa"
          level: CAN_MANAGE_RUN
        # ARM: view runs and errors when the pipeline fails
        - group_name: "lake_armrestricted_rusr_inpa"
