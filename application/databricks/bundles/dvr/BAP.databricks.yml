variables:
  # BAP stores service-principal credentials in the shared OEDS secret scope.
  secrete_scope:
    default: "lake-kv-oedataservices-scope"

  # BAP uses environment-specific key names for job run-as service principals.
  # Each target overrides both empty defaults below.
  service_spn_id_key:
    default: ""
  service_spn_secrete_key:
    default: ""

targets:
  dev:
    default: true
    variables:
      # lake-dev-oedataservices-services
      job_runas_account: "2b501945-5940-4527-9cdd-51a07b77ceb7"
      job_alert_emails:
        - dda-support-dev@bank-banque-canada.ca
      job_permissions:
        - group_name: "lake_aeengsupport_rusr_inda"
          level: CAN_MANAGE
        # lake-dev-oedataservices-services
        - service_principal_name: "2b501945-5940-4527-9cdd-51a07b77ceb7"
          level: CAN_MANAGE_RUN
      # Testing: ARM/MDM recipient temporarily disabled.
      email_mappings: '{"ISLS":"SIslam@bank-banque-canada.ca"}'
      # lake-dev-oedataservices-services
      service_spn_id_key: "app-2b501945-5940-4527-9cdd-51a07b77ceb7-appid"
      service_spn_secrete_key: "app-2b501945-5940-4527-9cdd-51a07b77ceb7-secret"

  stg:
    mode: production
    variables:
      # lake-stg-oedataservices-services
      job_runas_account: "118bb443-4441-422d-b9b4-14cdc5ede028"
      job_alert_emails:
        - dda-support-stg@bank-banque-canada.ca
        - DataLakeMonitoring-STG@bank-banque-canada.ca
      job_permissions:
        - group_name: "lake_aeengsupport_rusr_inpa"
          level: CAN_MANAGE
        # lake-stg-oedataservices-services
        - service_principal_name: "118bb443-4441-422d-b9b4-14cdc5ede028"
          level: CAN_MANAGE_RUN
        - group_name: "lake_dmengineer_rusr_inpa"
          level: CAN_MANAGE_RUN
      # Testing: ARM/MDM recipient temporarily disabled.
      email_mappings: '{"ISLS":"SIslam@bank-banque-canada.ca"}'
      # lake-stg-oedataservices-services
      service_spn_id_key: "app-118bb443-4441-422d-b9b4-14cdc5ede028-appid"
      service_spn_secrete_key: "app-118bb443-4441-422d-b9b4-14cdc5ede028-secret"

  prd:
    mode: production
    variables:
      # lake-prd-oedataservices-services
      job_runas_account: "9a4da41a-bd6d-4773-99ce-2ba8b78f4d65"
