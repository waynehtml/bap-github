<html>
<head>
  <style>
    body { margin: 0; background: #f5f7fa; color: #1f2933; font-family: Arial, sans-serif; }
    .container { width: 100%; max-width: 760px; margin: 0 auto; }
    .header { padding: 28px 32px; background: #0b4f6c; color: #ffffff; }
    .header h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .header p { margin: 8px 0 0; font-size: 14px; color: #d7edf7; }
    .content { padding: 28px 32px 32px; background: #ffffff; }
    .status { margin: 0 0 24px; padding: 14px 16px; border-left: 4px solid $status_color; background: $status_background; font-size: 16px; }
    .status strong { color: $status_color; }
    h2 { margin: 28px 0 12px; font-size: 17px; color: #0b4f6c; }
    .details { width: 100%; border-collapse: collapse; font-size: 14px; }
    .details td { padding: 10px 12px; border-bottom: 1px solid #dce3e8; }
    .details td:first-child { width: 32%; color: #52606d; font-weight: 700; }
    .details td:last-child { word-break: break-word; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { padding: 10px 12px; background: #e7f1f5; border: 1px solid #c7d6dd; color: #123b4d; text-align: left; }
    td { padding: 10px 12px; border: 1px solid #dce3e8; }
    tr:nth-child(even) td { background: #f8fafb; }
    .footer { padding: 16px 32px; background: #edf1f3; color: #52606d; font-size: 12px; }
    @media only screen and (max-width: 600px) {
      .header, .content, .footer { padding-left: 18px; padding-right: 18px; }
      .details td:first-child { width: 40%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>WP1 Pipeline Completion Report</h1>
      <p>BAP HABS Workpackage 1</p>
    </div>
    <div class="content">
      <p class="status">Pipeline status: <strong>$status</strong></p>

      <h2>Run Details</h2>
      <table class="details" role="presentation">
        <tr><td>Job name</td><td>$job_name</td></tr>
        <tr><td>Environment</td><td>$ENV</td></tr>
        <tr><td>Run date</td><td>$run_date</td></tr>
        <tr><td>Job run ID</td><td>$job_run_id</td></tr>
      </table>

      <h2>Task Results</h2>
      $email_table_html
    </div>
    <div class="footer">Automated notification from the BAP HABS WP1 Databricks job.</div>
  </div>
</body>
</html>
